<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="icon.png" type="image/png">
    
</head>

<body>
    <div class="wrapper">
        <div class="login-box">
            <div class="login-header">
                <span>Login</span>
            </div>
            <form id="login-form" onsubmit="return validateLogin(event)">
                <div class="input-box">
                    <input type="text" id="username" class="input-field" required>
                    <label for="user" class="label">Username</label>
                    <i class="bx bx-user icon"></i><br><br>
                </div>
                <div class="input-box">
                    <input type="password" id="password" class="input-field" autocomplete="off">
                    <label for="pass" class="label">Password</label>
                    <i class="bx bx-lock-alt icon" id="show-password"></i>
                </div>
                <div class="remember-forgot">
                    <div class="remember-me">
                        <label for="remember"></label>
                    </div>
                    <div class="forgot">
                        <a href="#"></a>
                    </div>
                </div>

                <div class="input-box">
                    <input type="submit" class="input-submit" value="Login">
                </div>
                <div class="register">
                    <span> <a href="#"></a></span>
                </div>
            </form>

            <!-- Error message will be displayed here if credentials are wrong -->
            <div id="error-message" class="error-message"></div>
        </div>

    <script>
        function validateLogin(event) {
            // Prevent form submission to handle login manually
            event.preventDefault();

            // Get values from the input fields
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            // Define valid credentials
            var validUsername = 'admin';
            var validPassword = 'pass12';

            // Get the error message div
            var errorMessageDiv = document.getElementById('error-message');

            // Clear any previous error messages
            errorMessageDiv.textContent = '';

            // Validate if the credentials match
            if (username === validUsername && password === validPassword) {
                // Redirect to another page (e.g., dashboard.html)
                window.location.href = 'http://www.fileapp.infinityfreeapp.com/index.php?p=';
            } else {
                // If the credentials are wrong, display an error message
                errorMessageDiv.textContent = 'DANGEROUS, You are not 2M';
            }
        }
    </script>

    <!-- Copyright Notice -->
    <div class="copyright">
        &copy; 2025 2EM_DRILL. All rights reserved.
    </div>
</body>

</html>
